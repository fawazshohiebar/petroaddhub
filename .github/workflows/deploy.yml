name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # Pull the latest code
            git pull origin main
            
            # Install dependencies
            # Note: Using --no-interaction prevents the script from hanging
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Statamic & Laravel Housekeeping
            php artisan optimize
            php artisan statamic:stache:clear
            
            # Secure Permissions
            # Set directory permissions to 775 and files to 664
            find storage bootstrap/cache content -type d -exec chmod 775 {} +
            find storage bootstrap/cache content -type f -exec chmod 664 {} +