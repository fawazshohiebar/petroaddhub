name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Sync any changes made in the Statamic Control Panel
            # This prevents merge conflicts during the pull
            git add .
            git commit -m "System: Content sync from Control Panel" || echo "No changes to commit"
            
            # 2. Pull the latest code from GitHub
            git pull origin main --rebase
            
            # 3. Smart Composer: Only install if the lock file changed
            # Uses git diff to see if the composer.lock was updated in this push
            if git diff --name-only HEAD@{1} HEAD | grep -q "composer.lock"; then
                echo "Composer changes detected. Installing..."
                composer install --no-dev --optimize-autoloader --no-interaction
            else
                echo "No composer changes. Skipping install to save time."
            fi

            # 4. Clear and rebuild system caches
            # This optimizes the site for production
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 5. Fix permissions
            # Ensures the web server (www-data) can still write to necessary folders
            sudo chown -R fawaz:www-data storage bootstrap/cache content
            chmod -R 775 storage bootstrap/cache content