name: Deploy PetroAddHub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy via CloudPanel User
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }} # Must be set to 'fawaz'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true # Stops script immediately if any error happens over SSH
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            bash deploy.sh