name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Sync any changes made in the Control Panel
            # This prevents "Merge Conflicts" if you edited a page in the UI
            git add .
            git commit -m "System: Content sync from Control Panel" || echo "No changes to commit"
            
            # 2. Pull the latest code
            git pull origin main --rebase
            
            # 3. Smart Composer: Only install if the lock file changed
            if git diff --name-only HEAD@{1} HEAD | grep -q "composer.lock"; then
                echo "Composer changes detected. Installing..."
                composer install --no-dev --optimize-autoloader --no-interaction
            else
                echo "No composer changes. Skipping install."
            fi

            # 4. Clear and rebuild system caches
            # We use 'optimize' to cache config and routes for speed
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 5. Fix permissions
            # We ensure storage and content are writable by the web server
            sudo chown -R fawaz:www-data storage bootstrap/cache content
            chmod -R 775 storage bootstrap/cache content