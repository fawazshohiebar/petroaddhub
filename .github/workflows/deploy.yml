name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Setup identity so the server can commit
            git config user.name "Server"
            git config user.email "server@petroaddhub.com"
            
            # 2. Sync deletions/changes from the Control Panel
            git add .
            git commit -m "System: Sync from CP [skip ci]" || echo "Nothing to sync"
            
            # 3. Push server changes back to GitHub 
            # This is what updates your GitHub repo with the deleted sessions/content
            git push origin main
            
            # 4. Pull the new code you just pushed from your laptop
            git pull origin main --rebase
            
            # 5. Smart Composer install
            if git diff --name-only HEAD@{1} HEAD | grep -q "composer.lock"; then
                composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # 6. Optimized Cache Management
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 7. Permissions fix for the web server
            # We target only the folders that need to be writable
            chmod -R 775 storage bootstrap/cache content