name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project root
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Setup SSH agent so the server can authenticate with GitHub
            eval $(ssh-agent -s)
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
            
            # 2. Set Git identity (Required for the server to make commits)
            git config user.name "Server Bot"
            git config user.email "server@petroaddhub.com"
            
            # 3. Pull latest from GitHub first to avoid conflicts
            # We use --rebase to keep the history clean
            git pull origin main --rebase
            
            # 4. Sync any uncommitted changes BACK to GitHub (if any exist)
            # This is a safety net in case Statamic's Git integration missed something
            if [[ -n $(git status -s) ]]; then
                git add .
                git commit -m "chore: sync content from server [skip ci]"
                git push origin main
            else
                echo "No changes to sync from server"
            fi
            
            # 5. Production Build & Cleanup
            # Install dependencies only if the lock file changed
            if [ -f "composer.lock" ]; then
                composer install --no-dev --optimize-autoloader --no-interaction
            fi
            
            # Clear caches and optimize for Statamic/Laravel
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 6. Fix Permissions
            # Ensures the web server can still write to these folders
            chmod -R 775 storage bootstrap/cache content