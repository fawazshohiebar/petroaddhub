name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # THE FIX: This allows the server to use your key to talk back to GitHub
          envs: SSH_PRIVATE_KEY
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Setup local SSH agent to use the key for the GitHub push
            eval $(ssh-agent -s)
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
            
            # 2. Identity fix
            git config user.name "Server"
            git config user.email "server@petroaddhub.com"
            
            # 3. Commit deletions/changes (Statamic sessions/entries)
            git add .
            git commit -m "System: Sync from CP [skip ci]" || echo "Nothing to sync"
            
            # 4. Push back to GitHub (Now has the key to authenticate!)
            git push origin main
            
            # 5. Pull your new laptop changes
            git pull origin main --rebase
            
            # 6. Maintenance
            if git diff --name-only HEAD@{1} HEAD | grep -q "composer.lock"; then
                composer install --no-dev --optimize-autoloader --no-interaction
            fi
            php artisan optimize
            php artisan statamic:stache:clear
            chmod -R 775 storage bootstrap/cache content