name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true # Stops immediately if a command fails
          script: |
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Pull changes
            git pull origin main
            
            # 2. Optimized Install (skips if nothing changed)
            composer install --no-dev --optimize-autoloader --no-interaction --quiet
            
            # 3. Fast Cleanup
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 4. Silent Permissions (only on necessary folders)
            chmod -R 775 storage bootstrap/cache content