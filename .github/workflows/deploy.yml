name: Deploy PetroAddHub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: fawaz
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project root
            cd /home/fawaz/htdocs/petroaddhub.com
            
            # 1. Setup persistent SSH key for Git operations
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            # 2. Add GitHub to known_hosts
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            
            # 3. Configure Git globally (used by both this workflow and Statamic)
            git config --global user.name "Server Bot"
            git config --global user.email "server@petroaddhub.com"
            git config --global core.sshCommand "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
            
            # 4. Stash any uncommitted changes before pulling
            git stash
            
            # 5. Pull latest from GitHub
            git pull origin main --rebase
            
            # 6. Restore stashed changes if any existed
            git stash pop || echo "No stashed changes to restore"
            
            # 7. Sync any uncommitted changes BACK to GitHub (safety net)
            # This catches anything Statamic's Git integration might have missed
            if [[ -n $(git status -s) ]]; then
                git add .
                git commit -m "chore: sync content from server [skip ci]"
                git push origin main
            else
                echo "✓ No uncommitted changes - Statamic is handling Git properly"
            fi
            
            # 8. Production Build & Cleanup
            # Install dependencies only if the lock file changed
            if [ -f "composer.lock" ]; then
                composer install --no-dev --optimize-autoloader --no-interaction
            fi
            
            # Clear caches and optimize for Statamic/Laravel
            php artisan optimize
            php artisan statamic:stache:clear
            
            # 9. Fix Permissions
            # Ensures the web server can still write to these folders
            chmod -R 775 storage bootstrap/cache content